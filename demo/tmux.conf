# The demo's private tmux server: a quiet status line with the cc-watch strip
# on the right, as the README suggests.
set -g status-style "bg=colour236,fg=colour250"
set -g status-left " #S "
set -g status-left-length 30
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right " #{@cc_watch_agents} "
set -g status-right-length 60
